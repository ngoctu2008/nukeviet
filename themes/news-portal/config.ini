<?xml version="1.0" encoding="UTF-8"?>
<theme>
    <info>
        <name>News Portal</name>
        <author>Mystery Themes / Ported by Jules</author>
        <website>http://nukeviet.vn</website>
        <description>News Portal theme converted for NukeViet 4.5</description>
        <thumbnail>default.jpg</thumbnail>
    </info>
    <layoutdefault>body</layoutdefault>
    <positions>
        <position>
            <name>HEADER</name>
            <tag>[HEADER]</tag>
        </position>
        <position>
            <name>TOP_NAV</name>
            <tag>[TOP_NAV]</tag>
        </position>
        <position>
            <name>BREAKING_NEWS</name>
            <tag>[BREAKING_NEWS]</tag>
        </position>
        <position>
            <name>TOP_SLIDER</name>
            <tag>[TOP_SLIDER]</tag>
        </position>
        <position>
            <name>MAIN_CONTENT</name>
            <tag>[MAIN_CONTENT]</tag>
        </position>
        <position>
            <name>CONTENT_TOP</name>
            <tag>[CONTENT_TOP]</tag>
        </position>
        <position>
            <name>SIDEBAR</name>
            <tag>[SIDEBAR]</tag>
        </position>
        <position>
            <name>FOOTER_WIDGETS</name>
            <tag>[FOOTER_WIDGETS]</tag>
        </position>
        <position>
            <name>COPYRIGHT</name>
            <tag>[COPYRIGHT]</tag>
        </position>
    </positions>
    <setlayout>
        <layout>
            <name>body</name>
            <funcs>news:main,viewcat,detail</funcs>
        </layout>
    </setlayout>
</theme>
