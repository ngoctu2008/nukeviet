<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tu Vi Grid Mock</title>
    <style>
        /* Copied from themes/default/modules/huyen-hoc/css/tu-vi.css */
        /* Tu Vi Grid Layout - Based on User Requirement (Ty Top-Left) */
        .la-so-tu-vi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr); /* Fixed height rows */
            gap: 5px;
            width: 800px;
            margin: 0 auto;
            aspect-ratio: 1 / 1; /* Keep it square */
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 5px;
        }

        /* Base Palace Style */
        .cung-so {
            border: 1px solid #ccc;
            background: #fff;
            padding: 5px;
            font-size: 14px;
            position: relative;
            overflow: hidden; /* Prevent spill */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Responsive Font Size */
        @media (max-width: 768px) {
            .cung-so { font-size: 10px; padding: 2px; }
            .star-name { font-size: 9px; }
        }

        /* Specific Grid Positions */

        /* Top Row (Left to Right): Ty -> Hoi -> Tuat -> Dau */
        .cung-ty_chuot { grid-area: 1 / 1; background: #e0f7fa; }
        .cung-hoi      { grid-area: 1 / 2; }
        .cung-tuat     { grid-area: 1 / 3; }
        .cung-dau      { grid-area: 1 / 4; }

        /* Left Column (Top to Bottom): Ty -> Suu -> Dan -> Mao */
        /* Ty is 1/1 already */
        .cung-suu      { grid-area: 2 / 1; }
        .cung-dan      { grid-area: 3 / 1; }
        .cung-mao      { grid-area: 4 / 1; }

        /* Bottom Row (Left to Right): Mao -> Thin -> Ty(Ran) -> Ngo */
        /* Mao is 4/1 already */
        .cung-thin     { grid-area: 4 / 2; }
        .cung-ty_ran   { grid-area: 4 / 3; background: #ffebee; border: 2px solid red; } /* Highlight the previously missing one */
        .cung-ngo      { grid-area: 4 / 4; }

        /* Right Column (Bottom to Top): Ngo -> Mui -> Than -> Dau */
        /* Ngo is 4/4 already */
        .cung-mui      { grid-area: 3 / 4; }
        .cung-than     { grid-area: 2 / 4; }
        /* Dau is 1/4 already */

        /* Center (Thien Ban) */
        .cung-thien-ban {
            grid-area: 2 / 2 / 4 / 4; /* Spans Row 2-3, Col 2-3 */
            background: #fff8e1; /* Light yellow background for center */
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1>Mock Tu Vi Layout Check</h1>
    <div class="la-so-tu-vi-grid">
        <div class="cung-so cung-ty_chuot">Tý (Rat) [1,1]</div>
        <div class="cung-so cung-suu">Sửu (Ox) [2,1]</div>
        <div class="cung-so cung-dan">Dần (Tiger) [3,1]</div>
        <div class="cung-so cung-mao">Mão (Cat) [4,1]</div>

        <div class="cung-so cung-thin">Thìn (Dragon) [4,2]</div>
        <div class="cung-so cung-ty_ran">Tỵ (Snake) [4,3]</div> <!-- Previously Missing -->
        <div class="cung-so cung-ngo">Ngọ (Horse) [4,4]</div>

        <div class="cung-so cung-mui">Mùi (Goat) [3,4]</div>
        <div class="cung-so cung-than">Thân (Monkey) [2,4]</div>
        <div class="cung-so cung-dau">Dậu (Rooster) [1,4]</div>

        <div class="cung-so cung-tuat">Tuất (Dog) [1,3]</div>
        <div class="cung-so cung-hoi">Hợi (Pig) [1,2]</div>

        <div class="cung-thien-ban">Thiên Bàn (Center)</div>
    </div>
</body>
</html>
